<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5db6ee"/><stop offset="1" stop-color="#c9ecfb"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fa3dc"/><stop offset="1" stop-color="#14508a"/>
    </linearGradient>
  </defs>
  <rect width="180" height="180" fill="url(#sky)"/>
  <circle cx="146" cy="34" r="14" fill="#fff1a8"/>
  <path d="M0 104 Q22 96 45 104 T90 104 T135 104 T180 104 V180 H0 Z" fill="url(#water)"/>
  <path d="M0 104 Q22 96 45 104 T90 104 T135 104 T180 104" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <path d="M8 150 q6 -4 12 0 M120 156 q6 -4 12 0 M64 168 q6 -4 12 0" fill="none" stroke="#9fd8f5" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <!-- the line from off the top to the bobber -->
  <path d="M-4 6 Q30 40 40 92" fill="none" stroke="#fff" stroke-width="2.5"/>
  <!-- bobber -->
  <path d="M40 80 v-10" stroke="#14324a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="40" cy="68" r="3.5" fill="#ffc93c" stroke="#14324a" stroke-width="2"/>
  <path d="M28 96 a12 12 0 0 1 24 0 z" fill="#e8463a" stroke="#14324a" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M28 96 a12 12 0 0 0 24 0 z" fill="#fff" stroke="#14324a" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- splash drops -->
  <g fill="#fff" stroke="#14324a" stroke-width="2">
    <circle cx="96" cy="94" r="4"/><circle cx="150" cy="96" r="3.5"/><circle cx="108" cy="82" r="3"/>
  </g>
  <!-- the jumping fish -->
  <g transform="rotate(-28 122 74)">
    <path d="M86 74 L66 56 L70 74 L66 92 Z" fill="#f07b2a" stroke="#14324a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M110 52 L120 38 L136 54 Z" fill="#f07b2a" stroke="#14324a" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="118" cy="74" rx="36" ry="21" fill="#ffc23d" stroke="#14324a" stroke-width="4"/>
    <path d="M100 60 v28 M112 56 v36 M124 56 v36" stroke="#e08a1a" stroke-width="5" stroke-linecap="round" opacity=".7"/>
    <path d="M104 92 L114 104 L122 92" fill="#f07b2a" stroke="#14324a" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="138" cy="68" r="7" fill="#fff" stroke="#14324a" stroke-width="3"/>
    <circle cx="140" cy="68" r="3.5" fill="#14324a"/>
    <path d="M150 80 q-5 4 -10 2" fill="none" stroke="#14324a" stroke-width="3" stroke-linecap="round"/>
  </g>

<style>
  /* Layout: the 3D pond cross-section fills the screen; home top-left, the sticker row top-centre, mute top-right; tackle buttons bottom-left, the big reel button bottom-right; "?" and "!" bubbles float over the bait; the catch card is an overlay */
  :root{
    --sky:#A6DDF6; --cream:#FFF8E7; --lip:#E6D3A8; --ink:#1F3550; --gold:#FFC93C; --gold-edge:#E59A00;
    --go:#35C24A; --go-edge:#23912F; --stop:#FF6B5B; --stop-edge:#C94436; --reel:#3FA7E0; --reel-edge:#2479A8;
    --title:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;
    --st:env(safe-area-inset-top,0px); --sr:env(safe-area-inset-right,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px);
    --btn:clamp(56px,15vw,72px); --reelsz:clamp(104px,28vw,128px);
    color-scheme: light;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);font-family:var(--title);color:var(--ink);
    touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse 75% 70% at 50% 45%,transparent 55%,rgba(8,36,64,.28) 100%)}
  button{font:inherit;color:inherit;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;background:none}
  svg{display:block}

  /* ---------- home + HUD ---------- */
  #home{position:fixed;top:calc(10px + var(--st));left:calc(10px + var(--sl));z-index:50;
    width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#2a2140;background:rgba(255,255,255,.85);
    box-shadow:0 3px 0 rgba(0,0,0,.18);touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-decoration:none}
  #home svg{width:24px;height:24px}
  #home:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  #mute{position:fixed;z-index:46;top:calc(10px + var(--st));right:calc(10px + var(--sr));width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.85);box-shadow:0 3px 0 rgba(0,0,0,.18)}
  #mute svg{width:26px;height:26px}
  #stickers{position:fixed;top:calc(12px + var(--st));left:62px;right:62px;display:flex;justify-content:center;gap:5px;z-index:20;pointer-events:none}
  .stk{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.5);display:grid;place-items:center}
  .stk svg{width:32px;height:32px}
  .stk.got{background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
  .stk.pop{animation:pop .6s ease-out}

  /* ---------- tackle + reel ---------- */
  #tackle{position:fixed;left:calc(12px + var(--sl));bottom:calc(14px + var(--sb));display:flex;gap:10px;z-index:30}
  .tk{width:var(--btn);height:var(--btn);border-radius:50%;background:var(--cream);box-shadow:0 5px 0 var(--lip);display:grid;place-items:center}
  .tk svg{width:66%;height:66%}
  .tk.sel{box-shadow:0 0 0 4px var(--gold-edge),0 5px 0 var(--lip);transform:translateY(-3px)}
  .tk:disabled{opacity:.4}
  #reel{position:fixed;right:calc(16px + var(--sr));bottom:calc(16px + var(--sb));width:var(--reelsz);height:var(--reelsz);border-radius:50%;
    background:var(--reel);box-shadow:0 6px 0 var(--reel-edge);display:grid;place-items:center;z-index:30;touch-action:none;transition:background .15s}
  #reel.held{transform:translateY(4px);box-shadow:0 2px 0 var(--reel-edge)}
  #reel.rest{background:var(--go);box-shadow:0 6px 0 var(--go-edge)}
  #reel.pull{background:var(--stop);box-shadow:0 6px 0 var(--stop-edge)}
  #reel .wheel{width:88%;height:88%}
  #reel .hand{font-size:calc(var(--reelsz)*.5);line-height:1;display:none}
  #reel.pull .wheel{display:none}
  #reel.pull .hand{display:block;animation:nudge .35s ease-in-out infinite}
  #reel .ring{position:absolute;inset:-9px;width:calc(100% + 18px);height:calc(100% + 18px);transform:rotate(-90deg);pointer-events:none}
  #reel .ring circle{fill:none;stroke-width:7;stroke-linecap:round}

  /* ---------- bubbles + hint ---------- */
  .bub{position:fixed;left:0;top:0;z-index:25;pointer-events:none;transform:translate(-50%,-100%)}
  #bang{width:60px;height:60px;border-radius:50%;background:var(--stop);color:#fff;font:bold 42px/60px Verdana,Tahoma,sans-serif;text-align:center;
    box-shadow:0 4px 0 var(--stop-edge);animation:throb .32s ease-in-out infinite alternate}
  #q{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--ink);font:bold 26px/40px Verdana,Tahoma,sans-serif;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.15)}
  #msg{font-size:46px;line-height:1;animation:rise 1.6s ease-out forwards}
  #hint{position:fixed;left:0;top:0;z-index:26;font-size:48px;line-height:1;pointer-events:none;animation:poke 1s ease-in-out infinite}

  /* ---------- catch card ---------- */
  #card{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(20,50,80,.35)}
  #card .box{position:relative;background:var(--cream);border-radius:28px;padding:14px 22px 20px;box-shadow:0 8px 0 var(--lip),0 14px 30px rgba(0,0,0,.25);
    display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .35s ease-out;max-width:calc(100vw - 24px)}
  #fishc{width:min(78vw,360px);height:min(39vw,180px,30vh);display:block}
  #card h2{margin:0;font-size:32px;line-height:1.1}
  #size{font:bold 24px/1 Verdana,Tahoma,sans-serif;display:flex;align-items:center;gap:8px}
  #size svg{width:34px;height:20px}
  #new{position:absolute;top:-14px;right:-8px;background:var(--gold);color:#7a4b00;padding:6px 12px;border-radius:14px;font-size:20px;transform:rotate(8deg);box-shadow:0 3px 0 var(--gold-edge)}
  #letgo{width:clamp(66px,17vh,90px);height:clamp(66px,17vh,90px);border-radius:50%;background:var(--reel);box-shadow:0 6px 0 var(--reel-edge);display:grid;place-items:center;margin-top:4px}
  #letgo svg{width:60%;height:60%}
  #letgo:active{transform:translateY(4px);box-shadow:0 2px 0 var(--reel-edge)}

  @keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes nudge{0%,100%{transform:none}50%{transform:scale(1.15)}}
  @keyframes throb{to{transform:scale(1.18)}}
  @keyframes rise{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-50px}}
  #hint.drag{animation:pullback 1.6s ease-in-out infinite}
  #hint.crank{animation:crank 1.1s linear infinite}
  @keyframes crank{from{transform:translate(-30%,-30%) rotate(0deg) translateX(32px) rotate(0deg)}to{transform:translate(-30%,-30%) rotate(360deg) translateX(32px) rotate(-360deg)}}
  #depth{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.75);transform:translate(-50%,0);display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.12)}
  #depth svg{width:22px;height:22px}
  #depth.held{background:var(--gold)}
  @keyframes pullback{0%{transform:translate(-30%,0);opacity:0}15%{opacity:1}60%{transform:translate(calc(-30% - 70px),55px);opacity:1}80%,100%{transform:translate(calc(-30% - 70px),55px);opacity:0}}
  @keyframes poke{0%,100%{transform:translate(-30%,0)}50%{transform:translate(-30%,-14px)}}
</style>

  </div>

<script type="module">
import * as THREE from 'three';

/* ======== tuning knobs ======== */
const STRIKE_WINDOW = 1.8;     // seconds to tap after the bobber goes under or the bell rings
const NOTICE_EVERY = 0.5;      // how often a wandering fish looks around for bait (s)
const SENSE = { float: 3.4, bottom: 4.2, lure: 4.2 };   // how far away a fish notices each bait
const REEL_SPEED = 2.3;        // a resting fish comes in this fast while you reel
const RETRIEVE_SPEED = 3.0;    // an empty bobber or sinker comes in this fast
const LURE_SPEED = 2.3;        // a lure swims back this fast while you reel
const LURE_SINK = 0.8;         // a lure sinks this fast while you don't
const TENSION_UP = 0.6;        // line tension per second when you reel while a fish pulls (1 = it gets away)
const TENSION_DOWN = 0.25;     // ...and how fast it eases off while you reel a resting fish (faster when you don't)
const ESCAPE_COOL = 8;         // a fish that got away ignores bait this long (s)
const SNAP_SPIT = 2.2;         // after the line snaps, the fish swims off this long before it shakes the hook out (s)
const CRANK_FULL = 7;          // winding the reel this fast (radians a second, about a turn a second) reels at full speed
const HINT_AFTER = 4;
const VIEW_W = 19;             // how much of the pond fits across a landscape screen (world units; the jetty end to the far bank is ~16)          // idle seconds before the pointing hand shows where to tap

const GRAVITY = 14;            // how fast a thrown bait falls
const SLING_REACH = 0.2;       // how far the bait can be pulled out of the slingshot (share of the screen's short side): a full-strength throw
const GRAB_PX = 75;            // how near the bait (on screen) a finger has to land to grab it
const BOOT_REACH = 2.2;        // a sinker this near the old boot (world x) snags it; a bobber's worm near the bottom, a bit less
const PULL_MIN = 0.12;         // a pull shorter than this share of a full one is called off
const WORM_BITE = 0.3;         // how much of the worm each nibble eats (1 = a whole worm)
const FLOAT_DEPTH = -1.6;      // where the worm hangs under a new bobber (drag the worm to change it)

// band: [top, bottom] of the water the fish likes (y, the surface is 0); bottom: hugs the lake bed instead.
// likes: how keen it is on each bait (0..1); nibbles: [min, max] nibbles before the real bite; fight: how hard it pulls.
const SPECIES = {
  roach:   { name: 'Roach', len: 0.75, h: 0.32, w: 0.14, cm: [12, 25], band: [-0.8, -3.0], speed: 0.9, likes: { float: 1, bottom: 0.35 }, nibbles: [1, 3], fight: 0.5,
             back: 0x4f6b80, side: 0xc4d3de, belly: 0xf4f6f8, fin: 0xe0533f },
  perch:   { name: 'Perch', len: 0.85, h: 0.38, w: 0.16, cm: [15, 35], band: [-1.2, -4.0], speed: 1.0, chase: 3.0, likes: { float: 0.8, lure: 0.9 }, nibbles: [0, 2], fight: 0.8,
             back: 0x34511f, side: 0x9fb85a, belly: 0xefe6b4, fin: 0xf07b2a, stripes: true, spiky: true },
  carp:    { name: 'Carp', len: 1.35, h: 0.6, w: 0.32, cm: [35, 70], bottom: true, speed: 0.55, likes: { bottom: 1, float: 0.3 }, nibbles: [1, 3], fight: 1.3,
             back: 0x6b4a1c, side: 0xd29a2c, belly: 0xf2d68c, fin: 0xa8652a, barbels: true, snout: 0.35 },
  pike:    { name: 'Pike', len: 1.9, h: 0.4, w: 0.22, cm: [50, 95], band: [-0.9, -4.0], speed: 0.8, chase: 3.5, likes: { lure: 1 }, fight: 1.6,
             back: 0x2d4a22, side: 0x6f913a, belly: 0xe8eac8, fin: 0x8d9a3a, spots: true, taper: 0.45, snout: 0.05, dorsalX: -0.55, dorsalLen: 0.18 },
  catfish: { name: 'Catfish', len: 1.6, h: 0.42, w: 0.34, cm: [45, 90], bottom: true, speed: 0.45, likes: { bottom: 1 }, nibbles: [0, 2], fight: 1.4,
             back: 0x2c2c36, side: 0x5f5866, belly: 0xcfc6b8, fin: 0x3a3642, whiskers: true, flatHead: true, roundTail: true, taper: 0.5, dorsalX: 0.2, dorsalLen: 0.12 },
  boot:    { name: 'Old boot', junk: true, len: 0.62, h: 0.5, cm: [24, 30], bottom: true, likes: { bottom: 1 }, nibbles: [0, 0], fight: 0 },
};
const ORDER = ['roach', 'perch', 'carp', 'pike', 'catfish', 'boot'];
const POND = ['roach', 'roach', 'roach', 'perch', 'perch', 'carp', 'carp', 'pike', 'catfish', 'boot'];
const BOOT_X = 3.6;

/* ======== helpers ======== */
const V3 = THREE.Vector3;
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const ease = (u) => u * u * (3 - 2 * u);
const params = new URLSearchParams(location.search);
const FORCE_MUTE = params.has('mute') || params.has('tbxtest') || navigator.webdriver === true;   // test runs stay silent
const NS = 'gonefishing.';
function load(k, d) { try { const v = localStorage.getItem(NS + k); return v == null ? d : JSON.parse(v); } catch { return d; } }
function save(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); } catch {} }
const $ = (id) => document.getElementById(id);

/* ======== the lake bed ======== */
// One profile, extruded back into the scene: the cut face at the front is the cross-section.
const BED_KNOTS = [[-16, 1.3], [-10, 1.15], [-8.4, 0.8], [-7.3, -0.6], [-5.4, -2.8], [-3, -4.5], [0, -5.5], [3, -5.8], [5.6, -4.7], [7.6, -2.5], [9.2, -0.5], [10.4, 0.75], [12, 1.1], [16, 1.3]];
const BED = new THREE.SplineCurve(BED_KNOTS.map(([x, y]) => new THREE.Vector2(x, y))).getSpacedPoints(900);
function bedY(x) {
  let lo = 0, hi = BED.length - 1;
  if (x <= BED[0].x) return BED[0].y;
  if (x >= BED[hi].x) return BED[hi].y;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (BED[m].x <= x) lo = m; else hi = m; }
  const a = BED[lo], b = BED[hi];
  return a.y + (b.y - a.y) * (x - a.x) / ((b.x - a.x) || 1);
}
const wave = (x, t) => 0.05 * Math.sin(x * 1.3 + t * 1.6) + 0.03 * Math.sin(x * 2.7 - t * 2.1);
const JETTY_END = -6.0, DECK_Y = 1.0;
const LAND = new V3(-5.5, -0.4, 0);   // where a reeled-in fish is lifted out
const SLING = new V3(-6.25, DECK_Y + 1.25, 0);   // the slingshot's pouch: the bait sits here, ready to throw
const SLING_BACK = new V3(SLING.x - 0.32, SLING.y + 0.2, -0.15), SLING_FRONT = new V3(SLING.x + 0.26, SLING.y + 0.17, 0.15);   // prong tips

/* ======== renderer, scene, camera ======== */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.25;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd8f0ff, 45, 135);   // haze on the far hills
{
  const g = document.createElement('canvas'); g.width = 2; g.height = 256;
  const x = g.getContext('2d'), grad = x.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#3E9FE6'); grad.addColorStop(0.45, '#8ECFF5'); grad.addColorStop(0.8, '#D2EEFC'); grad.addColorStop(1, '#FFF4DE');
  x.fillStyle = grad; x.fillRect(0, 0, 2, 256);
  const tex = new THREE.CanvasTexture(g); tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
}
const FOV = 30;
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.5, 200);
scene.add(new THREE.HemisphereLight(0xdff2ff, 0x7a9a5a, 1.6));
const sunLight = new THREE.DirectionalLight(0xfff0d4, 2.6); sunLight.position.set(8, 14, 10); scene.add(sunLight);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(1024, 1024);
Object.assign(sunLight.shadow.camera, { left: -16, right: 16, top: 12, bottom: -10, near: 1, far: 60 });
sunLight.shadow.bias = -0.0006; sunLight.shadow.normalBias = 0.03; sunLight.shadow.radius = 3;

const view = { w: 20, h: 12, cy: -1.4, dist: 30, cx: -2, zoom: 1 };
function fit() {
  const w = innerWidth, h = innerHeight, a = w / h;
  if (!w || !h) return;   // a hidden or collapsed window: keep the last good view
  renderer.setSize(w, h, false);
  camera.aspect = a;
  const wantW = a >= 1 ? VIEW_W : clamp(9.5 + (a - 0.5) * 18, 9.5, VIEW_W);
  view.h = Math.max(11.5, wantW / a);
  view.w = view.h * a;
  view.cy = -1.4 + Math.max(0, view.h - 12) * 0.24;
  view.dist = view.h / 2 / Math.tan(THREE.MathUtils.degToRad(FOV / 2));
  camera.updateProjectionMatrix();
}
addEventListener('resize', fit); fit();

/* ======== scenery ======== */
const lam = (color, o = {}) => new THREE.MeshLambertMaterial({ color, ...o });
function addMesh(geo, mat, x = 0, y = 0, z = 0, parent = scene) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m; }

// Soil strata: bands that follow the bed, extruded from z=-14 to the cut face at z=1.5.
const FRONT_Z = 1.5;
{
  const xs = []; for (let x = -16; x <= 16.001; x += 0.2) xs.push(x);
  const bands = [[0, 0.18], [0.18, 0.9], [0.9, 2.2], [2.2, null]];
  const cols = [null, new THREE.Color(0x9a6a3c), new THREE.Color(0x7c5331), new THREE.Color(0x5d4c47)];
  const grass = new THREE.Color(0x78c24e), sand = new THREE.Color(0xcdb17a);
  // speckles and faint layering, multiplied over the band colours (the cut face's uv is world x, y)
  const tc = document.createElement('canvas'); tc.width = tc.height = 256;
  const cx = tc.getContext('2d'); cx.fillStyle = '#e8e8e8'; cx.fillRect(0, 0, 256, 256);
  for (let k = 0; k < 14; k++) { cx.fillStyle = `rgba(${k % 2 ? 255 : 120},${k % 2 ? 255 : 110},${k % 2 ? 255 : 100},0.10)`; cx.fillRect(0, rand(0, 256), 256, rand(2, 10)); }
  for (let k = 0; k < 900; k++) {
    const l = Math.random() < 0.5 ? 255 : 90; cx.fillStyle = `rgba(${l},${l},${l},${rand(0.08, 0.3)})`;
    cx.beginPath(); cx.arc(rand(0, 256), rand(0, 256), rand(0.6, 2.6), 0, 7); cx.fill();
  }
  const soilTex = new THREE.CanvasTexture(tc); soilTex.wrapS = soilTex.wrapT = THREE.RepeatWrapping; soilTex.repeat.set(0.4, 0.4); soilTex.colorSpace = THREE.SRGBColorSpace;
  const mat = lam(0xffffff, { vertexColors: true, map: soilTex });
  bands.forEach(([a, b], i) => {
    const s = new THREE.Shape();
    s.moveTo(xs[0], bedY(xs[0]) - a);
    for (const x of xs.slice(1)) s.lineTo(x, bedY(x) - a);
    for (const x of xs.slice().reverse()) s.lineTo(x, b == null ? -16 : bedY(x) - b);
    const geo = new THREE.ExtrudeGeometry(s, { depth: FRONT_Z + 14, bevelEnabled: false });
    geo.translate(0, 0, -14);
    const p = geo.attributes.position, col = new Float32Array(p.count * 3);
    for (let k = 0; k < p.count; k++) {
      const c = i === 0 ? (p.getY(k) > 0.02 ? grass : sand) : cols[i];
      col[k * 3] = c.r; col[k * 3 + 1] = c.g; col[k * 3 + 2] = c.b;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    addMesh(geo, mat);
  });
  // pebbles poking out of the cut face
  const peb = new THREE.DodecahedronGeometry(1, 0);
  for (let k = 0; k < 34; k++) {
    const x = rand(-15, 15), y = bedY(x) - rand(1.0, 6), r = rand(0.1, 0.28);
    const m = addMesh(peb, lam([0x8d8580, 0x6f6863, 0xa39a8f][k % 3], { flatShading: true }), x, y, FRONT_Z - r * 0.3);
    m.scale.set(r * 1.3, r, r); m.rotation.set(rand(0, 3), rand(0, 3), 0);
  }
  // rocks on the lake bed
  for (const [x, z, r] of [[-2.2, -1.8, 0.35], [1.4, 0.6, 0.28], [5.0, -2.5, 0.45], [6.4, 0.9, 0.22], [-4.1, -0.4, 0.25]]) {
    const m = addMesh(peb, lam(0x8a8f96, { flatShading: true }), x, bedY(x) + r * 0.4, z);
    m.scale.set(r * 1.4, r, r * 1.2); m.rotation.y = rand(0, 3);
  }
  // the far shore
  addMesh(new THREE.BoxGeometry(160, 2, 60), lam(0x84c75a), 0, -0.1, -44);
  for (let k = 0; k < 7; k++) {
    const m = addMesh(new THREE.SphereGeometry(1, 16, 10), lam([0x7bbf55, 0x6aae4c, 0x8fcf66][k % 3]), -36 + k * 12 + rand(-3, 3), 0.4, -30 - rand(0, 12));
    m.scale.set(rand(8, 14), rand(2.5, 5), 6);
  }
}

// Water: a tinted front pane (the glass of the cut), a back wall, and the wavy surface.
const water = {};
{
  const top = new THREE.Color(0x7fd0f2), mid = new THREE.Color(0x2f86c0), deep = new THREE.Color(0x123f6e);
  const c = new THREE.Color();
  const g = new THREE.PlaneGeometry(32, 14.2, 1, 1); g.translate(0, -6.9, 0);
  water.front = addMesh(g, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uTime: { value: 0 }, uTop: { value: top }, uMid: { value: mid }, uDeep: { value: deep } },
    vertexShader: `varying vec2 vP;
      void main() { vec4 w = modelMatrix * vec4(position, 1.0); vP = w.xy; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `uniform float uTime; uniform vec3 uTop, uMid, uDeep; varying vec2 vP;
      float wave(float x, float t) { return 0.05 * sin(x * 1.3 + t * 1.6) + 0.03 * sin(x * 2.7 - t * 2.1); }
      // three bent wave trains; bright thin lines where they cancel out, like sunlight through ripples
      float caustic(vec2 p, float t) {
        float a = sin(p.x * 2.1 + sin(p.y * 1.7 + t * 0.8) * 1.4 + t * 0.6);
        float b = sin(p.y * 2.6 + sin(p.x * 1.3 - t * 0.7) * 1.6 - t * 0.5);
        float c = sin((p.x + p.y) * 1.8 + sin(p.x * 0.9 + t) * 1.2 + t * 0.4);
        return pow(1.0 - abs((a + b + c) / 3.0), 10.0);
      }
      void main() {
        float below = wave(vP.x, uTime) - vP.y;
        if (below < 0.0) discard;
        float d = clamp(below / 7.0, 0.0, 1.0);
        vec3 col = d < 0.5 ? mix(uTop, uMid, d * 2.0) : mix(uMid, uDeep, (d - 0.5) * 2.0);
        float a = 0.14 + 0.56 * d;
        float k = caustic(vP * 1.7, uTime * 0.8) * (1.0 - smoothstep(0.0, 5.0, below)) * 0.45;
        col += vec3(0.85, 1.0, 1.0) * k; a += k * 0.3;
        float line = 1.0 - smoothstep(0.0, 0.06, below);
        col = mix(col, vec3(1.0), line * 0.9); a = mix(a, 0.95, line);
        gl_FragColor = vec4(col, a);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
  }), 0, 0, FRONT_Z - 0.01);
  water.front.renderOrder = 10;

  const b = new THREE.PlaneGeometry(32, 14, 1, 8); b.translate(0, -7.05, 0);
  const bp = b.attributes.position, bc = new Float32Array(bp.count * 3);
  for (let k = 0; k < bp.count; k++) { c.copy(mid).lerp(deep, clamp(-bp.getY(k) / 6, 0, 1)).multiplyScalar(0.85); bc.set([c.r, c.g, c.b], k * 3); }
  b.setAttribute('color', new THREE.BufferAttribute(bc, 3));
  addMesh(b, new THREE.MeshBasicMaterial({ vertexColors: true }), 0, 0, -4);

  const s = new THREE.PlaneGeometry(32, 15.5, 96, 1); s.rotateX(-Math.PI / 2); s.translate(0, 0, FRONT_Z - 7.75);
  water.surf = addMesh(s, new THREE.MeshPhongMaterial({ color: 0x62c4ec, shininess: 120, specular: 0xd8eeff, transparent: true, opacity: 0.85 }));
  water.surf.renderOrder = 9;

  // light shafts under the surface
  water.shafts = [];
  for (const [x, rz] of [[-3.5, 0.22], [0.5, 0.18], [4.2, 0.26], [7.0, 0.2]]) {
    const sg = new THREE.PlaneGeometry(1.1, 6, 1, 1); sg.translate(0, -3, 0);
    const sp = sg.attributes.position, sc = new Float32Array(sp.count * 4);
    for (let k = 0; k < sp.count; k++) sc.set([1, 1, 0.85, sp.getY(k) > -1 ? 0.16 : 0], k * 4);
    sg.setAttribute('color', new THREE.BufferAttribute(sc, 4));
    const m = addMesh(sg, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }), x, 0, 0.9);
    m.rotation.z = rz; m.renderOrder = 8; m.userData.ph = rand(0, 6);
    water.shafts.push(m);
  }
}
function updateWater(T) {
  const p = water.surf.geometry.attributes.position;
  for (let k = 0; k < p.count; k++) p.setY(k, wave(p.getX(k), T));
  p.needsUpdate = true;
  water.front.material.uniforms.uTime.value = T;
  water.surf.geometry.computeVertexNormals();
  for (const m of water.shafts) m.material.opacity = 0.6 + 0.4 * Math.sin(T * 0.7 + m.userData.ph);

// Weeds that sway, lily pads, reeds.
const weeds = [];
{
  const mats = [lam(0x3f8f3a, { side: THREE.DoubleSide }), lam(0x5aa843, { side: THREE.DoubleSide }), lam(0x2f7445, { side: THREE.DoubleSide })];
  for (let k = 0; k < 18; k++) {
    let x; do { x = rand(-5.5, 8.6); } while (bedY(x) > -1.6);
    const hgt = Math.min(rand(0.8, 2.4), -bedY(x) - 0.6);
    const g = new THREE.PlaneGeometry(rand(0.12, 0.22), hgt, 1, 8); g.translate(0, hgt / 2, 0);
    const m = addMesh(g, mats[k % 3], x, bedY(x) - 0.05, rand(-3, 1.1));

}
function updateWeeds(T) {
  for (const m of weeds) {
    const p = m.geometry.attributes.position, { base, hgt, ph } = m.userData;
    for (let k = 0; k < p.count; k++) {
      const u = base[k * 3 + 1] / hgt;

}

{

// Life around the pond: a duck family, a frog on a lily pad, a dragonfly.
const life = { ducks: [], frog: null, fly: null };
{
  const duck = (s, body, head) => {
    const g = new THREE.Group(); g.scale.setScalar(s); scene.add(g);
    addMesh(new THREE.SphereGeometry(0.3, 14, 10), lam(body), 0, 0.12, 0, g).scale.set(1.25, 0.75, 0.85);
    addMesh(new THREE.ConeGeometry(0.1, 0.25, 6), lam(body), -0.38, 0.22, 0, g).rotation.z = 1.9;
    addMesh(new THREE.SphereGeometry(0.16, 12, 10), lam(head), 0.25, 0.42, 0, g);
    addMesh(new THREE.ConeGeometry(0.06, 0.2, 6), lam(0xff9a2e), 0.44, 0.4, 0, g).rotation.z = -Math.PI / 2;
    for (const z of [0.1, -0.1]) addMesh(new THREE.SphereGeometry(0.03, 6, 4), lam(0x111111), 0.33, 0.47, z, g);

  };

  frog.throat = addMesh(new THREE.SphereGeometry(0.08, 10, 8), lam(0xd8f0a8), 0.13, 0.05, 0, frog);
  for (const z of [0.08, -0.08]) {
    addMesh(new THREE.SphereGeometry(0.06, 10, 8), fg, 0.08, 0.2, z, frog);
    addMesh(new THREE.SphereGeometry(0.04, 8, 6), eyeW, 0.11, 0.22, z * 1.15, frog);
    addMesh(new THREE.SphereGeometry(0.022, 6, 4), lam(0x111111), 0.135, 0.225, z * 1.3, frog);

  const fly = new THREE.Group(); scene.add(fly);
  addMesh(new THREE.CapsuleGeometry(0.025, 0.4, 3, 6), lam(0x2a7fd8), 0, 0, 0, fly).rotation.z = Math.PI / 2;
  addMesh(new THREE.SphereGeometry(0.045, 8, 6), lam(0x1d5fa8), 0.23, 0, 0, fly);

}
function updateLife(T) {

    d.g.position.set(x, wave(x, T) - 0.02, -6.5 + d.lag * 0.25);
    d.g.rotation.y = damp(d.g.rotation.y, dir > 0 ? 0 : Math.PI, 3, 1 / 60);
    d.g.rotation.z = Math.sin(T * 2 + d.lag) * 0.05;

// The line is a flat ribbon (WebGL lines are always one pixel wide).
function ribbon(color) {
  const N = 40, g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 6), 3));
  const idx = []; for (let k = 0; k < N - 1; k++) { const a = k * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  g.setIndex(idx);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide }));

}

const _q = new V3();
function setLine(m, a, b, sag, width = 0.035) {
  const N = m.userData.N, p = m.geometry.attributes.position, pts = [];
  const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2 - sag, cz = (a.z + b.z) / 2;
  for (let k = 0; k < N; k++) {
    const u = k / (N - 1), v = 1 - u;
    pts.push(new V3(v * v * a.x + 2 * u * v * cx + u * u * b.x, v * v * a.y + 2 * u * v * cy + u * u * b.y, v * v * a.z + 2 * u * v * cz + u * u * b.z));
  }
  for (let k = 0; k < N; k++) {
    const p0 = pts[Math.max(0, k - 1)], p1 = pts[Math.min(N - 1, k + 1)];
    let tx = p1.x - p0.x, ty = p1.y - p0.y; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    const nx = -ty * width / 2, ny = tx * width / 2;
    p.setXYZ(k * 2, pts[k].x + nx, pts[k].y + ny, pts[k].z);
    p.setXYZ(k * 2 + 1, pts[k].x - nx, pts[k].y - ny, pts[k].z);
  }
  p.needsUpdate = true; m.visible = true;
}

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) hiddenAt = Date.now();
    else if (newer && hiddenAt && Date.now() - hiddenAt >= 5 * 60 * 1000) reload();
  });
}
</script>
</body>
</html>
